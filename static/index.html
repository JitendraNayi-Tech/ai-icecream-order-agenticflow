<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scoops &amp; Co - Agentic Ordering</title>
<style>
  :root { --bg:#fdf8f3; --panel:#fff; --ink:#2b2320; --muted:#8a7d76; --line:#eee3da;
          --accent:#d94f70; --you:#fde3ea; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; gap:12px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:17px; margin:0; flex:1; }
  main { display:grid; grid-template-columns: 300px 1fr 280px; height: calc(100vh - 57px); }
  #chat { display:flex; flex-direction:column; min-height:0; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:75%; padding:8px 12px; border-radius:12px; background:var(--panel); border:1px solid var(--line); white-space:pre-wrap; }
  .msg.you { align-self:flex-end; background:var(--you); border-color:transparent; }
  .who { font-size:11px; font-weight:600; color:var(--accent); text-transform:uppercase; letter-spacing:.04em; margin-bottom:2px; }
  .typing { color:var(--muted); font-style:italic; font-size:13px; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); background:var(--panel); }
  input[type=text] { flex:1; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font:inherit; }
  button { padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  aside { border-left:1px solid var(--line); background:var(--panel); padding:16px; overflow-y:auto; }
  aside h2 { font-size:13px; text-transform:uppercase; color:var(--muted); margin:0 0 8px; letter-spacing:.05em; }
  aside section { margin-bottom:24px; }
  .steps { list-style:none; padding:0; margin:0; }
  .steps li { padding:4px 0 4px 22px; position:relative; color:var(--muted); }
  .steps li::before { content:""; position:absolute; left:4px; top:10px; width:9px; height:9px; border-radius:50%; border:2px solid var(--line); }
  .steps li.done { color:var(--ink); }
  .steps li.done::before { background:var(--accent); border-color:var(--accent); }
  .cart-line { font-size:13px; padding:4px 0; border-bottom:1px dashed var(--line); }
  /* Cost panel (left) */
  aside#costs { border-left:0; border-right:1px solid var(--line); }
  .kv { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
  .kv td { padding:3px 0; }
  .kv td:last-child { text-align:right; }
  .kv tr.total td { font-weight:700; border-top:1px solid var(--line); padding-top:6px; }
  .kv th { font-size:11px; font-weight:600; color:var(--muted); text-align:right; padding:0 0 4px; }
  .kv th:first-child { text-align:left; }
  .kv td.code { color:var(--muted); font-style:italic; }
  .badge { display:inline-block; font-size:10px; font-weight:700; letter-spacing:.04em; padding:1px 6px;
           border-radius:9px; background:var(--you); color:var(--accent); vertical-align:middle; }
  .note { font-size:11px; color:var(--muted); margin-top:6px; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr 280px; } aside#costs { display:none; } }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; } aside { display:none; } }
</style>
</head>
<body>
<header>
  <h1>🍦 Scoops &amp; Co</h1>
  <label>Customer <select id="customer"></select></label>
</header>
<main>
  <aside id="costs">
    <section><h2>Order cost <span id="cost-order"></span></h2>
      <table class="kv" id="cost-order-table"></table>
    </section>
    <section><h2>AI cost</h2>
      <table class="kv" id="cost-ai-table"></table>
    </section>
    <section><h2>By agent</h2>
      <table class="kv" id="cost-agents"></table>
    </section>
    <section id="cost-history-section" hidden><h2>Earlier orders</h2>
      <table class="kv" id="cost-history"></table>
    </section>
    <div class="note">AI cost = API-equivalent price reported per Claude call.
      "code" = step handled without Claude ($0).</div>
  </aside>
  <div id="chat">
    <div id="log"></div>
    <form id="form"><input id="text" type="text" placeholder="e.g. what should I get today?" autocomplete="off"><button>Send</button></form>
  </div>
  <aside>
    <section><h2>Cart</h2><div id="cart"><em>Empty</em></div></section>
    <section><h2>Order <span id="order-id"></span></h2>
      <ul class="steps" id="steps"></ul>
      <div id="eta" class="typing"></div>
    </section>
  </aside>
</main>
<script>
const STEPS = ["PLACED", "PREPARING", "READY", "OUT_FOR_DELIVERY", "DELIVERED"];
const $ = (id) => document.getElementById(id);
let ws, typingEl;

function renderSteps(status) {
  const idx = STEPS.indexOf(status);
  $("steps").innerHTML = STEPS.map((s, i) =>
    `<li class="${i <= idx ? "done" : ""}">${s.replaceAll("_", " ").toLowerCase()}</li>`).join("");
}

function addMessage(who, text, you) {
  clearTyping();
  const el = document.createElement("div");
  el.className = "msg" + (you ? " you" : "");
  el.innerHTML = `<div class="who"></div><div class="body"></div>`;
  el.querySelector(".who").textContent = who;
  el.querySelector(".body").textContent = text;
  $("log").appendChild(el);
  $("log").scrollTop = $("log").scrollHeight;
}

function clearTyping() { if (typingEl) { typingEl.remove(); typingEl = null; } }

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const usd = (n, d = 2) => `$${Number(n).toFixed(d)}`;
const pct = (n) => n == null ? "–" : `${n.toFixed(2)}%`;

function renderUsage(u) {
  const c = u.current;
  $("cost-order").innerHTML = c.order_id
    ? `${esc(c.order_id)} <span class="badge">${esc(c.status.replaceAll("_", " "))}</span>`
    : `<span class="badge">${esc(c.status.replaceAll("_", " "))}</span>`;
  $("cost-order-table").innerHTML = `
    <tr><td>Subtotal</td><td>${usd(c.subtotal)}</td></tr>
    <tr><td>Discount</td><td>${c.discount ? "-" + usd(c.discount) : usd(0)}</td></tr>
    <tr class="total"><td>Order total</td><td>${usd(c.total)}</td></tr>`;
  $("cost-ai-table").innerHTML = `
    <tr><td>Claude calls</td><td>${c.claude_runs}</td></tr>
    <tr><td>Tokens in / out</td><td>${(c.input_tokens + c.cache_read_tokens + c.cache_write_tokens).toLocaleString()} / ${c.output_tokens.toLocaleString()}</td></tr>
    <tr><td>Cache read / write</td><td>${c.cache_read_tokens.toLocaleString()} / ${c.cache_write_tokens.toLocaleString()}</td></tr>
    <tr class="total"><td>AI cost</td><td>${usd(c.ai_cost_usd, 4)}</td></tr>
    <tr><td>AI share of order</td><td>${pct(c.ai_share_pct)}</td></tr>`;
  $("cost-agents").innerHTML = `<tr><th>Agent</th><th>Runs</th><th>Cost</th></tr>` +
    (c.by_agent.length ? c.by_agent.map((a) => a.runs
      ? `<tr><td>${esc(a.label)}</td><td>${a.runs}</td><td>${usd(a.cost_usd, 4)}</td></tr>`
      : `<tr><td>${esc(a.label)}</td><td class="code">code</td><td>${usd(0, 4)}</td></tr>`).join("")
      : `<tr><td colspan="3" class="code">No activity yet</td></tr>`);
  $("cost-history-section").hidden = !u.history.length;
  $("cost-history").innerHTML = `<tr><th>Order</th><th>Total</th><th>AI cost</th></tr>` +
    u.history.map((h) => `<tr><td>${esc(h.order_id)}</td><td>${usd(h.total)}</td>
      <td>${usd(h.ai_cost_usd, 4)} <span class="note">(${pct(h.ai_share_pct)})</span></td></tr>`).join("");
}

function connect(customerId) {
  if (ws) ws.close();
  $("log").innerHTML = ""; $("cart").innerHTML = "<em>Empty</em>";
  $("order-id").textContent = ""; $("eta").textContent = ""; renderSteps(null);
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws/${customerId}`);
  ws.onmessage = (ev) => {
    const f = JSON.parse(ev.data);
    if (f.type === "message") addMessage(f.agent, f.text, f.agent === "You");
    else if (f.type === "typing") {
      clearTyping();
      typingEl = document.createElement("div");
      typingEl.className = "typing";
      typingEl.textContent = `${f.agent} is typing…`;
      $("log").appendChild(typingEl);
    } else if (f.type === "status") {
      $("order-id").textContent = f.order_id;
      renderSteps(f.status);
      $("eta").textContent = f.status === "DELIVERED" ? "Delivered" :
        f.status === "CANCELLED" ? "Cancelled" : `ETA ~${f.eta_minutes} min`;
    } else if (f.type === "cart") {
      $("cart").innerHTML = f.items.length ? "" : "<em>Empty</em>";
      for (const it of f.items) {
        const d = document.createElement("div");
        d.className = "cart-line";
        d.textContent = `#${it.line_id} ${it.quantity}× ${it.description} ($${it.unit_price.toFixed(2)})`;
        $("cart").appendChild(d);
      }
    } else if (f.type === "usage") renderUsage(f);
  };
}

$("form").onsubmit = (e) => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  addMessage("You", text, true);
  ws.send(JSON.stringify({ text }));
  $("text").value = "";
};

fetch("/api/customers").then(r => r.json()).then(list => {
  $("customer").innerHTML = list.map(c =>
    `<option value="${c.id}">${c.name} (${c.loyalty_tier})</option>`).join("");
  $("customer").onchange = () => { location.hash = $("customer").value; connect($("customer").value); };
  // Deep link: /#pavani opens that customer's chat.
  const wanted = location.hash.slice(1);
  const start = list.some((c) => c.id === wanted) ? wanted : list[0].id;
  $("customer").value = start;
  connect(start);
});
renderSteps(null);
</script>
</body>
</html>
